name: Script member serial components
on:
  push:
    branches: [research/script-member-serial-validation]
  pull_request:
permissions:
  contents: read
jobs:
  selector:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Component tests only, no game or proprietary files
        run: python patches/test_script_serial_guard.py --report script-serial-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: script-serial-${{ matrix.os }}
          path: script-serial-ci.json
