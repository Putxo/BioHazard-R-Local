name: Runtime composition and freestanding link
on:
  pull_request:
  push:
    branches: [research/runtime-composition]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [native, sanitized]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compose the real components with synthetic native operations
        shell: bash
        run: |
          FLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror"
          if [ "${{ matrix.mode }}" = sanitized ]; then FLAGS="$FLAGS -fsanitize=address,undefined -fno-omit-frame-pointer"; fi
          g++ $FLAGS -Ipatches/hud_ownership patches/hud_ownership/*.cpp patches/genesis/*.cpp patches/runtime/runtime.cpp patches/runtime/draw_schedule.cpp patches/menu_routing/menu_owner.cpp patches/action_icons/*.cpp tests/runtime/runtime_tests.cpp -o "$RUNNER_TEMP/runtime-tests"
          "$RUNNER_TEMP/runtime-tests"
          g++ $FLAGS patches/runtime/draw_schedule.cpp tests/runtime/draw_schedule_tests.cpp -o "$RUNNER_TEMP/draw-schedule-tests"
          "$RUNNER_TEMP/draw-schedule-tests"
          g++ $FLAGS patches/runtime/draw_schedule.cpp tests/runtime/hunter_cache_tests.cpp -o "$RUNNER_TEMP/hunter-cache-tests"
          "$RUNNER_TEMP/hunter-cache-tests"
          g++ $FLAGS patches/genesis/hunter_materials.cpp tests/genesis/hunter_materials_tests.cpp -o "$RUNNER_TEMP/hunter-material-tests"
          "$RUNNER_TEMP/hunter-material-tests"
      - name: Heal visual notification queue
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ipatches/hud_ownership patches/hud_ownership/heal_queue.cpp tests/hud_ownership/heal_queue_tests.cpp -o "$RUNNER_TEMP/heal-queue"
          "$RUNNER_TEMP/heal-queue"
          as --32 patches/hud_ownership/heal_gateway.S -o "$RUNNER_TEMP/heal-gate.o"
          as --32 tests/hud_ownership/heal_gateway_abi.S -o "$RUNNER_TEMP/heal-abi.o"
          ld -m elf_i386 "$RUNNER_TEMP/heal-gate.o" "$RUNNER_TEMP/heal-abi.o" -o "$RUNNER_TEMP/heal-abi"
          "$RUNNER_TEMP/heal-abi"
      - name: Draw selector x86 ABI with synthetic calls
        run: |
          as --32 patches/runtime/draw_schedule.S -o "$RUNNER_TEMP/draw-schedule.o"
          as --32 tests/runtime/draw_schedule_abi.S -o "$RUNNER_TEMP/draw-schedule-test.o"
          ld -m elf_i386 -o "$RUNNER_TEMP/draw-schedule-abi" "$RUNNER_TEMP/draw-schedule.o" "$RUNNER_TEMP/draw-schedule-test.o"
          "$RUNNER_TEMP/draw-schedule-abi"
          as --32 patches/genesis/hunter_cache_gateway.S -o "$RUNNER_TEMP/hunter-cache.o"
          as --32 tests/genesis/hunter_cache_abi.S -o "$RUNNER_TEMP/hunter-cache-test.o"
          ld -m elf_i386 -o "$RUNNER_TEMP/hunter-cache-abi" "$RUNNER_TEMP/hunter-cache.o" "$RUNNER_TEMP/hunter-cache-test.o"
          "$RUNNER_TEMP/hunter-cache-abi"
          g++ -m32 -std=c++17 -O2 -Wall -Wextra -Werror -ffreestanding -fno-exceptions -fno-rtti -fno-stack-protector -fno-pie -c tests/genesis/hunter_material_gateway_abi.cpp -o "$RUNNER_TEMP/hunter-material-test.o"
          as --32 patches/genesis/hunter_material_gateway.S -o "$RUNNER_TEMP/hunter-material.o"
          as --32 tests/genesis/hunter_material_gateway_abi.S -o "$RUNNER_TEMP/hunter-material-abi.o"
          ld -m elf_i386 -o "$RUNNER_TEMP/hunter-material-abi" "$RUNNER_TEMP/hunter-material.o" "$RUNNER_TEMP/hunter-material-test.o" "$RUNNER_TEMP/hunter-material-abi.o"
          "$RUNNER_TEMP/hunter-material-abi"
      - name: Lifetime regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ipatches/hud_ownership patches/hud_ownership/{ownership,lifetime_source}.cpp tests/hud_ownership/lifetime_source_tests.cpp -o "$RUNNER_TEMP/lifetime-tests"
          "$RUNNER_TEMP/lifetime-tests"
  freestanding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install LLVM linker
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Link every production HUD and menu gateway with the startup graph
        run: python tools/build_runtime.py "$RUNNER_TEMP/runtime-module"
      - name: Reject missing or discarded hooks and invalid images
        run: REV_RUNTIME_ELF="$RUNNER_TEMP/runtime-module/runtime.elf" python tests/runtime/test_runtime_image.py
      - name: Validate Hunter material audit harness
        run: python tests/genesis/test_hunter_materials_audit.py

