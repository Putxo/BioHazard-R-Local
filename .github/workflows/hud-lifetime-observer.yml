name: HUD lifetime source observer
on:
  push:
    branches: [research/hud-lifetime-observer]
  pull_request:
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        mode: [native, sanitized]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Real registry and lifetime source, mocked memory and Self lookup
        shell: bash
        run: |
          FLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror"
          if [ "${{ matrix.mode }}" = sanitized ]; then FLAGS="$FLAGS -fsanitize=address,undefined -fno-omit-frame-pointer"; fi
          g++ $FLAGS -Ipatches/hud_ownership patches/hud_ownership/{ownership,lifetime_source}.cpp tests/hud_ownership/lifetime_source_tests.cpp -o "$RUNNER_TEMP/lifetime-test"
          "$RUNNER_TEMP/lifetime-test"
      - name: Freestanding i386 source syntax
        run: g++ -m32 -std=c++17 -Wall -Wextra -Werror -ffreestanding -fno-exceptions -fno-rtti -fsyntax-only patches/hud_ownership/lifetime_source.cpp
  gateways:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Actual 11 gateways with synthetic receiver and continuations
        run: |
          as --32 patches/hud_ownership/lifetime_gateways.S -o "$RUNNER_TEMP/life-gates.o"
          as --32 tests/hud_ownership/lifetime_gateway_abi.S -o "$RUNNER_TEMP/life-harness.o"
          ld -m elf_i386 "$RUNNER_TEMP/life-gates.o" "$RUNNER_TEMP/life-harness.o" -o "$RUNNER_TEMP/life-abi"
          "$RUNNER_TEMP/life-abi"
