name: Genesis progress ownership
on:
  pull_request:
  push:
    branches: [research/genesis-progress]
permissions:
  contents: read
jobs:
  counter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [native, sanitized]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Independent counter and lifetime rejection
        run: |
          FLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror"
          if [ "${{ matrix.mode }}" = sanitized ]; then FLAGS="$FLAGS -fsanitize=address,undefined -fno-omit-frame-pointer"; fi
          g++ $FLAGS patches/genesis/progress.cpp tests/genesis/progress_tests.cpp -o "$RUNNER_TEMP/genesis-progress"
          "$RUNNER_TEMP/genesis-progress"
      - name: Synthetic x86 call-site gateway ABI
        run: |
          as --32 patches/genesis/progress_gateways.S -o "$RUNNER_TEMP/progress-gates.o"
          as --32 tests/genesis/progress_abi.S -o "$RUNNER_TEMP/progress-abi.o"
          ld -m elf_i386 "$RUNNER_TEMP/progress-gates.o" "$RUNNER_TEMP/progress-abi.o" -o "$RUNNER_TEMP/progress-abi"
          "$RUNNER_TEMP/progress-abi"
      - name: Scanner resource graph and actor gateway ABI
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror patches/genesis/resources.cpp tests/genesis/resources_tests.cpp -o "$RUNNER_TEMP/scanner-resources"
          "$RUNNER_TEMP/scanner-resources"
          as --32 patches/hud_ownership/self_bridges.S -o "$RUNNER_TEMP/scanner-self.o"
          as --32 patches/genesis/actor_gateway.S -o "$RUNNER_TEMP/scanner-actor.o"
          as --32 tests/genesis/actor_abi.S -o "$RUNNER_TEMP/scanner-abi.o"
          ld -m elf_i386 "$RUNNER_TEMP/scanner-self.o" "$RUNNER_TEMP/scanner-actor.o" "$RUNNER_TEMP/scanner-abi.o" -o "$RUNNER_TEMP/scanner-abi"
          "$RUNNER_TEMP/scanner-abi"
      - name: Scanner owner camera and x86 gateway ABI
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror patches/genesis/camera.cpp tests/genesis/camera_tests.cpp -o "$RUNNER_TEMP/scanner-camera"
          "$RUNNER_TEMP/scanner-camera"
          as --32 patches/genesis/camera_gateway.S -o "$RUNNER_TEMP/camera-gate.o"
          as --32 tests/genesis/camera_abi.S -o "$RUNNER_TEMP/camera-abi.o"
          ld -m elf_i386 "$RUNNER_TEMP/camera-gate.o" "$RUNNER_TEMP/camera-abi.o" -o "$RUNNER_TEMP/camera-abi"
          "$RUNNER_TEMP/camera-abi"
