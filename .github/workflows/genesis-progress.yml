name: Genesis progress ownership
on:
  pull_request:
  push:
    branches: [research/genesis-progress]
permissions:
  contents: read
jobs:
  effect-lifetimes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [native, sanitized]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Scheduled effect identity and destructor revocation
        run: |
          FLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror"
          if [ "${{ matrix.mode }}" = sanitized ]; then FLAGS="$FLAGS -fsanitize=address,undefined -fno-omit-frame-pointer"; fi
          g++ $FLAGS patches/genesis/effect_lifetime.cpp tests/genesis/effect_lifetime_tests.cpp -o "$RUNNER_TEMP/effect-lifetime"
          "$RUNNER_TEMP/effect-lifetime"
          g++ $FLAGS patches/genesis/effect_lifetime.cpp patches/genesis/filter_resource.cpp patches/genesis/effects.cpp tests/genesis/effects_tests.cpp -o "$RUNNER_TEMP/effects"
          "$RUNNER_TEMP/effects"
          as --32 patches/genesis/effect_gateways.S -o "$RUNNER_TEMP/effect-gates.o"
          as --32 tests/genesis/effect_abi.S -o "$RUNNER_TEMP/effect-abi.o"
          ld -m elf_i386 "$RUNNER_TEMP/effect-gates.o" "$RUNNER_TEMP/effect-abi.o" -o "$RUNNER_TEMP/effect-abi"
          "$RUNNER_TEMP/effect-abi"
  filter-copy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [native, sanitized]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Private mutable filter resources and failure paths
        run: |
          FLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror"
          if [ "${{ matrix.mode }}" = sanitized ]; then FLAGS="$FLAGS -fsanitize=address,undefined -fno-omit-frame-pointer"; fi
          g++ $FLAGS patches/genesis/filter_resource.cpp tests/genesis/filter_resource_tests.cpp -o "$RUNNER_TEMP/filter-resource"
          "$RUNNER_TEMP/filter-resource"
          as --32 patches/genesis/filter_gateway.S -o "$RUNNER_TEMP/filter-gate.o"
          as --32 tests/genesis/filter_abi.S -o "$RUNNER_TEMP/filter-abi.o"
          ld -m elf_i386 "$RUNNER_TEMP/filter-gate.o" "$RUNNER_TEMP/filter-abi.o" -o "$RUNNER_TEMP/filter-abi"
          "$RUNNER_TEMP/filter-abi"
  completion-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Target completion and aligned native frame exit
        run: |
          as --32 patches/genesis/completion_gateway.S -o "$RUNNER_TEMP/completion-gate.o"
          as --32 tests/genesis/completion_abi.S -o "$RUNNER_TEMP/completion-abi.o"
          ld -m elf_i386 "$RUNNER_TEMP/completion-gate.o" "$RUNNER_TEMP/completion-abi.o" -o "$RUNNER_TEMP/completion-abi"
          "$RUNNER_TEMP/completion-abi"
  counter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [native, sanitized]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Independent counter and lifetime rejection
        run: |
          FLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror"
          if [ "${{ matrix.mode }}" = sanitized ]; then FLAGS="$FLAGS -fsanitize=address,undefined -fno-omit-frame-pointer"; fi
          g++ $FLAGS patches/genesis/progress.cpp tests/genesis/progress_tests.cpp -o "$RUNNER_TEMP/genesis-progress"
          "$RUNNER_TEMP/genesis-progress"
      - name: Synthetic x86 call-site gateway ABI
        run: |
          as --32 patches/genesis/progress_gateways.S -o "$RUNNER_TEMP/progress-gates.o"
          as --32 tests/genesis/progress_abi.S -o "$RUNNER_TEMP/progress-abi.o"
          ld -m elf_i386 "$RUNNER_TEMP/progress-gates.o" "$RUNNER_TEMP/progress-abi.o" -o "$RUNNER_TEMP/progress-abi"
          "$RUNNER_TEMP/progress-abi"
      - name: Scanner resource graph and actor gateway ABI
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror patches/genesis/resources.cpp tests/genesis/resources_tests.cpp -o "$RUNNER_TEMP/scanner-resources"
          "$RUNNER_TEMP/scanner-resources"
          as --32 patches/hud_ownership/self_bridges.S -o "$RUNNER_TEMP/scanner-self.o"
          as --32 patches/genesis/actor_gateway.S -o "$RUNNER_TEMP/scanner-actor.o"
          as --32 tests/genesis/actor_abi.S -o "$RUNNER_TEMP/scanner-abi.o"
          ld -m elf_i386 "$RUNNER_TEMP/scanner-self.o" "$RUNNER_TEMP/scanner-actor.o" "$RUNNER_TEMP/scanner-abi.o" -o "$RUNNER_TEMP/scanner-abi"
          "$RUNNER_TEMP/scanner-abi"
      - name: Scanner owner camera and x86 gateway ABI
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror patches/genesis/camera.cpp tests/genesis/camera_tests.cpp -o "$RUNNER_TEMP/scanner-camera"
          "$RUNNER_TEMP/scanner-camera"
          as --32 patches/genesis/camera_gateway.S -o "$RUNNER_TEMP/camera-gate.o"
          as --32 tests/genesis/camera_abi.S -o "$RUNNER_TEMP/camera-abi.o"
          ld -m elf_i386 "$RUNNER_TEMP/camera-gate.o" "$RUNNER_TEMP/camera-abi.o" -o "$RUNNER_TEMP/camera-abi"
          "$RUNNER_TEMP/camera-abi"
      - name: Observed target lifetimes and constructor/destructor ABI
        run: |
          FLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror"
          if [ "${{ matrix.mode }}" = sanitized ]; then FLAGS="$FLAGS -fsanitize=address,undefined -fno-omit-frame-pointer"; fi
          g++ $FLAGS patches/genesis/target_lifetime.cpp tests/genesis/target_lifetime_tests.cpp -o "$RUNNER_TEMP/target-lifetime"
          "$RUNNER_TEMP/target-lifetime"
          as --32 patches/genesis/target_gateways.S -o "$RUNNER_TEMP/target-gates.o"
          as --32 tests/genesis/target_abi.S -o "$RUNNER_TEMP/target-abi.o"
          ld -m elf_i386 "$RUNNER_TEMP/target-gates.o" "$RUNNER_TEMP/target-abi.o" -o "$RUNNER_TEMP/target-abi"
          "$RUNNER_TEMP/target-abi"
      - name: View-derived target state stays separate from native world state
        run: |
          FLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror"
          if [ "${{ matrix.mode }}" = sanitized ]; then FLAGS="$FLAGS -fsanitize=address,undefined -fno-omit-frame-pointer"; fi
          g++ $FLAGS patches/genesis/target_lifetime.cpp patches/genesis/target_views.cpp tests/genesis/target_views_tests.cpp -o "$RUNNER_TEMP/target-views"
          "$RUNNER_TEMP/target-views"
      - name: Native target getter x86 ABI and stock trampolines
        run: |
          as --32 patches/genesis/target_consumers.S -o "$RUNNER_TEMP/target-consumers.o"
          as --32 tests/genesis/target_consumers_abi.S -o "$RUNNER_TEMP/target-consumers-abi.o"
          ld -m elf_i386 "$RUNNER_TEMP/target-consumers.o" "$RUNNER_TEMP/target-consumers-abi.o" -o "$RUNNER_TEMP/target-consumers-abi"
          "$RUNNER_TEMP/target-consumers-abi"
      - name: Detector scope and setter x86 ABI
        run: |
          as --32 patches/genesis/detector_gateways.S -o "$RUNNER_TEMP/detector-gates.o"
          as --32 tests/genesis/detector_abi.S -o "$RUNNER_TEMP/detector-abi.o"
          ld -m elf_i386 "$RUNNER_TEMP/detector-gates.o" "$RUNNER_TEMP/detector-abi.o" -o "$RUNNER_TEMP/detector-abi"
          "$RUNNER_TEMP/detector-abi"
      - name: Intrusive scanner collections and destructor cleanup ABI
        run: |
          FLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror"
          if [ "${{ matrix.mode }}" = sanitized ]; then FLAGS="$FLAGS -fsanitize=address,undefined -fno-omit-frame-pointer"; fi
          g++ $FLAGS patches/genesis/resources.cpp tests/genesis/collections_tests.cpp -o "$RUNNER_TEMP/collections"
          "$RUNNER_TEMP/collections"
          as --32 patches/genesis/removal_gateway.S -o "$RUNNER_TEMP/removal-gate.o"
          as --32 tests/genesis/removal_abi.S -o "$RUNNER_TEMP/removal-abi.o"
          ld -m elf_i386 "$RUNNER_TEMP/removal-gate.o" "$RUNNER_TEMP/removal-abi.o" -o "$RUNNER_TEMP/removal-abi"
          "$RUNNER_TEMP/removal-abi"
      - name: Scanner retained weapon belongs to the current owner inventory
        run: |
          FLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror"
          if [ "${{ matrix.mode }}" = sanitized ]; then FLAGS="$FLAGS -fsanitize=address,undefined -fno-omit-frame-pointer"; fi
          g++ $FLAGS patches/genesis/equipment.cpp tests/genesis/equipment_tests.cpp -o "$RUNNER_TEMP/equipment"
          "$RUNNER_TEMP/equipment"
      - name: Secondary-camera aiming visibility gateway ABI
        run: |
          as --32 patches/genesis/aim_gateway.S -o "$RUNNER_TEMP/aim-gate.o"
          as --32 tests/genesis/aim_abi.S -o "$RUNNER_TEMP/aim-abi.o"
          ld -m elf_i386 "$RUNNER_TEMP/aim-gate.o" "$RUNNER_TEMP/aim-abi.o" -o "$RUNNER_TEMP/aim-abi"
          "$RUNNER_TEMP/aim-abi"
      - name: World callback gate keeps detector locals and thiscall ABI
        run: |
          as --32 patches/genesis/notification_gateway.S -o "$RUNNER_TEMP/notification-gate.o"
          as --32 tests/genesis/notification_abi.S -o "$RUNNER_TEMP/notification-abi.o"
          ld -m elf_i386 "$RUNNER_TEMP/notification-gate.o" "$RUNNER_TEMP/notification-abi.o" -o "$RUNNER_TEMP/notification-abi"
          "$RUNNER_TEMP/notification-abi"
