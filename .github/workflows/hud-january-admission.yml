name: HUD January admission
on:
  push:
    branches: [research/hud-january-admission]
  pull_request:
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [native, sanitized]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Admission policy unit tests
        shell: bash
        run: |
          FLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror"
          if [ "${{ matrix.mode }}" = sanitized ]; then FLAGS="$FLAGS -fsanitize=address,undefined -fno-omit-frame-pointer"; fi
          g++ $FLAGS -Ipatches/hud_ownership patches/hud_ownership/january_admission.cpp tests/hud_ownership/january_admission_tests.cpp -o "$RUNNER_TEMP/admission"
          "$RUNNER_TEMP/admission"
      - name: Existing manager driver integration regression
        shell: bash
        run: |
          FLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror"
          if [ "${{ matrix.mode }}" = sanitized ]; then FLAGS="$FLAGS -fsanitize=address,undefined -fno-omit-frame-pointer"; fi
          g++ $FLAGS -Ipatches/hud_ownership patches/hud_ownership/{ownership,lifecycle,manager_driver}.cpp tests/hud_ownership/manager_driver_tests.cpp -o "$RUNNER_TEMP/driver"
          "$RUNNER_TEMP/driver"
      - name: Freestanding i386 syntax
        run: g++ -m32 -std=c++17 -Wall -Wextra -Werror -ffreestanding -fno-exceptions -fno-rtti -fsyntax-only patches/hud_ownership/january_admission.cpp
